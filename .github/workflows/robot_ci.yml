name: Demoblaze CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome for Testing
      run: |
        npx @puppeteer/browsers install chrome@stable
        npx @puppeteer/browsers install chromedriver@stable
        # Cari lokasi install-nya dan masukkan ke PATH
        CHROME_PATH=$(find $GITHUB_WORKSPACE -name chrome -type f -executable | head -n 1)
        DRIVER_PATH=$(find $GITHUB_WORKSPACE -name chromedriver -type f -executable | head -n 1)
        echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
        echo "CHROME_DRIVER=$DRIVER_PATH" >> $GITHUB_ENV
    
    - name: Create .env file
      run: |
        echo "DEFAULT_USER=${{ secrets.DEFAULT_USER }}" >> .env
        echo "DEFAULT_PASS=${{ secrets.DEFAULT_PASS }}" >> .env

    - name: Run The Tests
      run: |
        robot -d results --variable is_headless:True tests/

    - name: Save the report (artifacts)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-framework-reports
        path: results/
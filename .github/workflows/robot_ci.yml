name: Demoblaze CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run The Tests
      run: |
        robot -d results --variable is_headless:True tests/

    - name: Save the report (artifacts)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-framework-reports
        path: results/
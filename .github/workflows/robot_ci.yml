name: Demoblaze CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        echo "DEFAULT_USER=${{ secrets.DEFAULT_USER }}" >> .env
        echo "DEFAULT_PASS=${{ secrets.DEFAULT_PASS }}" >> .env

    - name: Run The Tests
      run: |
        robot -d results --variable is_headless:true tests/
    
    - name: Print Webdriver Logs on Failure
      if: failure()
      run: |
        echo "=== GEKODRIVER / CHROMEDRIVER LOGS ==="
        cat results/geckodriver-*.log 2>/dev/null || true
        cat chromedriver.log 2>/dev/null || true
        cat nodedebug.log 2>/dev/null || true

    - name: Save the report (artifacts)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-framework-reports
        path: results/